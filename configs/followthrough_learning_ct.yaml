defaults:
  - udlm_e_objective_ct
  - _self_

# Fresh 4k schedule, not continuation at a decayed 1k learning rate.
seed: 17400
trainer:
  max_steps: 4000
optim:
  scheduler:
    horizon_updates: 4000
training:
  reseed_after_model_initialization: true
  pilot_fail_on_nonfinite_loss: true
callback:
  every_n_train_steps: 1000
