defaults:
  - udlm_categorical
  - _self_

# New V8 control: all tokenizer controls are immutable targets/context.
# Historical CT default remains BOS/EOS/PAD only. Both V8 arms share this mask.
seed: 1500
loader:
  global_batch_size: 128
  batch_size: 16
  num_workers: 1
trainer:
  devices: 1
  num_nodes: 1
  accumulate_grad_batches: 8
  max_steps: 1000
  detect_anomaly: false
  log_every_n_steps: 10
optim:
  lr: 0.0003
  scheduler:
    name: half_cosine_with_linear_warmup_and_floor
    warmup_updates: 50
    horizon_updates: 1000
    decay_floor_lr: 0.000003
training:
  init_from_mdlm_ema: true
  reseed_after_model_initialization: false
  pilot_fail_on_nonfinite_loss: false
  udlm:
    parameterization: raw_loo
    mask_all_special_tokens: true
    exclude_special_tokens: false
    conditioning_variant: film_adaln
    zero_init_conditioning: false
    empirical_uniform_mix: 0.0002
callback:
  every_n_train_steps: 1000
